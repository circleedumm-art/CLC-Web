<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Circle Learning Centre</title>
<meta name="description" content="Circle Learning Centre – English and life-skills learning for youths in Myanmar.">
<meta name="theme-color" content="#F2F2F7">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Noto+Sans+Myanmar:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="icon" href="logo.png">
<link rel="stylesheet" href="style.css">
</head>
<body>

<header class="bar">
  <a class="brand" href="#top" aria-label="Circle Learning Centre">
    <img class="logo-img" src="logo.png" alt="" width="32" height="32" onerror="this.replaceWith(Object.assign(document.createElement('span'),{className:'logo'}))"><span class="brand-name">CLC</span>
  </a>
  <nav class="tabs" aria-label="Main">
    <a href="#about" data-i18n="nav_about"></a>
    <a href="#programs" data-i18n="nav_programs"></a>
    <a href="#schedule" data-i18n="nav_schedule"></a>
    <a href="#enrol" data-i18n="nav_enrol"></a>
  </nav>
  <div class="controls">
    <div class="seg" role="group" aria-label="Language">
      <button data-lang="en" aria-pressed="true">EN</button>
      <button data-lang="my" aria-pressed="false">မြန်မာ</button>
    </div>
    <button class="icon-btn" id="themeBtn" aria-label="Toggle dark mode"></button>
    <button class="btn small" id="loginBtn" data-i18n="login"></button>
  </div>
</header>

<main id="top">
  <section class="hero">
    <div class="rings" aria-hidden="true"><i></i><i></i><i></i></div>
    <h1 data-i18n="hero_title"></h1>
    <p class="lead" data-i18n="hero_sub"></p>
    <div class="actions">
      <a class="btn" href="#enrol" data-i18n="cta_enrol"></a>
      <a class="btn ghost" href="#programs" data-i18n="cta_programs"></a>
    </div>
  </section>

  <section id="about" class="wrap">
    <h2 data-i18n="about_h"></h2>
    <p class="body" data-i18n="about_p"></p>
    <ul class="group facts">
      <li><span data-i18n="f1_k"></span><b data-i18n="f1_v"></b></li>
      <li><span data-i18n="f2_k"></span><b data-i18n="f2_v"></b></li>
      <li><span data-i18n="f3_k"></span><b data-i18n="f3_v"></b></li>
    </ul>
  </section>

  <section id="programs" class="wrap">
    <h2 data-i18n="prog_h"></h2>
    <ul class="group" id="programList"></ul>
  </section>

  <section id="schedule" class="wrap">
    <h2 data-i18n="sched_h"></h2>
    <p class="note" data-i18n="sched_note"></p>
    <ul class="group" id="scheduleList"></ul>
  </section>

  <section id="enrol" class="wrap narrow">
    <h2 data-i18n="enrol_h"></h2>
    <p class="body" data-i18n="enrol_p"></p>
    <form id="enrolForm" class="group form" novalidate>
      <label><span data-i18n="f_name"></span><input name="name" required autocomplete="name"></label>
      <label><span data-i18n="f_contact"></span><input name="contact" type="email" inputmode="email" required autocomplete="email"></label>
      <label><span data-i18n="f_course"></span><select name="course" id="courseSelect"></select></label>
      <label><span data-i18n="f_note"></span><textarea name="note" rows="3"></textarea></label>
    </form>
    <p class="note" data-i18n="f_email_note"></p>
    <button class="btn wide" type="submit" form="enrolForm" data-i18n="f_submit"></button>
    <p class="ok" id="enrolOk" hidden data-i18n="f_ok"></p>
  </section>
</main>

<footer class="wrap foot">
  <span>© <span id="yr"></span> Circle Learning Centre</span>
  <span class="links"><a href="#" id="fb">Facebook</a><a href="#" id="yt">YouTube</a><a href="#" id="tt">TikTok</a><a href="admin.html" id="adminLink" hidden>Dashboard</a></span>
</footer>

<!-- Login sheet -->
<div class="scrim" id="scrim" hidden>
  <div class="sheet" role="dialog" aria-modal="true" aria-labelledby="loginTitle">
    <div class="grab"></div>
    <h3 id="loginTitle" data-i18n="login"></h3>
    <div class="seg full" id="roleSeg" role="group">
      <button data-role="student" aria-pressed="true" data-i18n="r_student"></button>
      <button data-role="teacher" aria-pressed="false" data-i18n="r_teacher"></button>
      <button data-role="admin" aria-pressed="false" data-i18n="r_admin"></button>
    </div>
    <form id="loginForm" class="group form" novalidate>
      <label data-idrow><span data-i18n="l_id"></span><input name="id" autocomplete="username"></label>
      <label data-idrow><span data-i18n="l_pw"></span><input name="pw" type="password" autocomplete="current-password"></label>
    </form>
    <button class="btn wide" id="signIn" data-i18n="l_signin"></button>
    <button class="btn ghost wide" id="googleBtn" data-i18n="l_google" hidden></button>
    <p class="note center err" id="loginErr" hidden></p>
    <p class="note center" data-i18n="l_soon"></p>
    <button class="link" id="closeSheet" data-i18n="close"></button>
  </div>
</div>

<div class="toast" id="toast" hidden></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script src="app.js"></script>
</body>
</html>
